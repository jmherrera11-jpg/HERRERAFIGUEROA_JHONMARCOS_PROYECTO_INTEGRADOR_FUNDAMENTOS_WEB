<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Daat Devotional</title>
    <link rel="icon" href="../../imagenes/perfil.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <nav>
        <div class="nav-logo">
            <img src="../../imagenes/LogoPrincipal.png" alt="Logo">
            <p>Daat Devotional</p>
        </div>
        <div class="nav-links">
            <button type="button" class="btn btn-light"><a href="../feed/inicio.html"><i class="fa-solid fa-house"></i>
                    Inicio</a></button>
            <button type="button" class="btn btn-light"><a href="../feed/grupos.html"><i class="fa-solid fa-users"></i>
                    Grupos</a></button>
            <button type="button" class="btn btn-light"><a href="../feed/foros.html"><i class="fa-solid fa-comments"></i>
                    Foros</a></button>
            <button type="button" class="btn btn-light"><a href="../feed/chat.html"><i class="fa-solid fa-comment-dots"></i>
                    Chat</a></button>
        </div>
        <div class="nav-usuario">
            <button type="button" class="btn btn-light">
                <a href="perfil.html">
                    <i class="fa-solid fa-user"></i> <span id="navUsuario">jhon32</span>
                </a>
            </button>
            <button type="button" class="btn btn-light">
                <a href="../../index.html" class="nav-salir">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </a>
            </button>
        </div>
    </nav>

    <main>
        <section id="perfil-usuario">
            <div class="tarjeta-perfil">
                <div class="banner-perfil"></div>
                <div class="perfil-info">
                    <img src="../../imagenes/Perfil.png" alt="Perfil" id="avatarPerfil">
                    <button class="btn-editar" id="btnEditarPerfil">Editar Perfil</button>

                    <div class="info-general">
                        <h1 id="nombrePerfil">jhon32</h1>
                        <div class="usuario" id="usuarioPerfil">@jhon32</div>
                        <div class="bio" id="bioPerfil">Estudiante de la Palabra, apasionado por el estudio bíblico profundo.</div>

                        <div class="info-enlaces">
                            <div><i class="fa-solid fa-calendar-days"></i> Se unió en <span id="fechaRegistro">Enero 2026</span></div>
                            <div id="nacionalidadPerfil" class="bandera-pais">
                                <i class="fa-solid fa-globe"></i> <span id="paisNombre">En todo el mundo</span>
                            </div>
                        </div>

                        <div class="info-seguimiento">
                            <div class="stat">
                                <div class="stat-label">Publicaciones</div>
                                <div class="stat-valor" id="statPublicaciones">0</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">Seguidores</div>
                                <div class="stat-valor" id="statSeguidores">0</div>
                            </div>
                            <div class="stat">
                                <div class="stat-label">Siguiendo</div>
                                <div class="stat-valor" id="statSiguiendo">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="publicaciones-perfil">
            <h2><i class="fa-solid fa-pen"></i> Mis Publicaciones</h2>

            <div class="grafico-perfil-container">
                <canvas id="graficoPerfil"></canvas>
            </div>

            <div id="listaMisPublicaciones"></div>
        </section>

        <!-- ============================================================ -->
        <!-- GALERÍA DE IMÁGENES DEL USUARIO (grid) -->
        <!-- ============================================================ -->
        <section id="galeria-usuario">
            <h2><i class="fa-solid fa-images"></i> Mis Imágenes</h2>
            <div id="galeriaContainer" class="galeria-grid">
                <!-- Las imágenes se generan dinámicamente desde JS -->
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Daat Devotional - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/perfil.js"></script>
</body>
</html>
