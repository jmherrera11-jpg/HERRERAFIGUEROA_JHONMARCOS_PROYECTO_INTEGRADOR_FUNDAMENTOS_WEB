<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Daat Devotional</title>
    <link rel="icon" href="../../imagenes/chat.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body>
    <nav>
        <div class="nav-logo">
            <img src="../../imagenes/LogoPrincipal.png" alt="Logo">
            <p>Daat Devotional</p>
        </div>
        <div class="nav-links">
            <button type="button" class="btn btn-light"><a href="inicio.html"><i class="fa-solid fa-house"></i>
                    Inicio</a></button>
            <button type="button" class="btn btn-light"><a href="grupos.html"><i class="fa-solid fa-users"></i>
                    Grupos</a></button>
            <button type="button" class="btn btn-light"><a href="foros.html"><i class="fa-solid fa-comments"></i>
                    Foros</a></button>
            <button type="button" class="btn btn-light"><a href="chat.html"><i class="fa-solid fa-comment-dots"></i>
                    Chat</a></button>
        </div>
        <div class="nav-usuario">
            <button type="button" class="btn btn-light">
                <a href="../usuario/perfil.html">
                    <i class="fa-solid fa-user"></i> <span id="navUsuario">jhon32</span>
                </a>
            </button>
            <button type="button" class="btn btn-light">
                <a href="../../index.html" class="nav-salir">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </a>
            </button>
        </div>
    </nav>

    <main>
        <section id="chat-principal" class="container-fluid">
            <div class="row">
                <!-- Panel izquierdo: lista de contactos -->
                <div class="panel-izquierdo col-12 col-md-4 col-lg-3">
                    <h2>Mensajes</h2>
                    <input type="text" id="buscarContacto" placeholder="Buscar conversaciones...">
                    <div id="listaContactos">
                        <!-- Los contactos se generan dinámicamente desde JS -->
                    </div>
                </div>

                <!-- Panel derecho: conversación activa -->
                <div class="panel-derecho col-12 col-md-8 col-lg-9">
                    <div class="chat-header" id="chatHeader">
                        <img src="../../imagenes/Perfil.png" alt="Perfil" id="chatAvatar">
                        <div class="chat-titulo">
                            <div class="nombre" id="chatNombre">Selecciona un contacto</div>
                            <div class="estado-header" id="chatEstado">Sin conversación</div>
                        </div>
                    </div>

                    <div class="mensajes" id="mensajesContainer">
                        <div class="mensaje-sistema">
                            <i class="fa-solid fa-comment-dots"></i>
                            Selecciona un contacto para comenzar a chatear
                        </div>
                    </div>

                    <div class="chat-input">
                        <input type="text" id="campoMensajeChat" placeholder="Escribe un mensaje..." disabled>
                        <button type="button" id="btnEnviarMensaje" disabled>
                            <i class="fa-solid fa-location-arrow"></i> Enviar
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Daat Devotional - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/chat.js"></script>
</body>

</html>
