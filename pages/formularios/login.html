<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Daat Devotional</title>
    <link rel="icon" href="../../imagenes/login.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>

<body id="login-page">
    <main>
        <section id="formulario-acceso">
            <div class="tarjeta-login">
                <img src="../../imagenes/LogoPrincipal.png" alt="Logo Principal">
                <h2>Daat Devotional</h2>
                <p>Inicia Sesión en tu cuenta</p>
                <form id="formLogin" method="POST" action="../feed/inicio.html" novalidate>
                    <div class="mb-3 row">
                        <div class="mb-2">
                            <label for="email" class="form-label">Correo Electrónico</label>
                            <input type="email" id="email" class="form-control" name="Email"
                                placeholder="tu@email.com" required>
                            <div id="estadoEmail" class="estado-input"></div>
                        </div>
                        <div class="mb-2">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" class="form-control" name="contraseña"
                                placeholder="Ingrese su contraseña" maxlength="20" minlength="8" required>
                            <span id="passwordHelpInline" class="form-text">
                            <div id="estadoPassword" class="estado-input">Escriba la contraseña de 8-20 caracteres</div>
                            </span>
                        </div>
                    </div>
                    <button type="submit">Iniciar Sesión</button>
                </form>
                <div class="enlaces-formulario">
                    <p>¿No tienes cuenta? <a href="registro.html"><b>Regístrate aquí</b></a></p>
                    <p><a href="../../index.html">← Volver al inicio</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Daat Devotional - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../../js/storage.js"></script>
    <script src="../../js/common.js"></script>
    <script src="../../js/login.js"></script>
</body>

</html>
