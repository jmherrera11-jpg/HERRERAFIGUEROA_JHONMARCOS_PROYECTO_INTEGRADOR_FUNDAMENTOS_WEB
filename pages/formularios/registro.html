<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Daat Devotional</title>
    <link rel="stylesheet" href="../../css/general.css">
    <link rel="stylesheet" href="../../css/registro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body id="registro-page">
    <main>
        <section id="formulario-registro">
            <div class="tarjeta-registro">
                <img src="../../imagenes/LogoPrincipal.png" alt="Logo Principal">
                <h2>Daat Devotional</h2>
                <p>Crea tu cuenta en la comunidad cristiana</p>
                
                <form id="formRegistro" method="POST" action="login.html">
                    <!-- Nombres -->
                    <div class="mb-2">
                        <label for="nombre">Nombres</label>
                        <input type="text" id="nombre" name="Nombres" placeholder="Ingresa tu nombre" 
                               maxlength="50" minlength="2" required>
                    </div>

                    <!-- Apellidos -->
                    <div class="mb-2">
                        <label for="apellido">Apellidos</label>
                        <input type="text" id="apellido" name="Apellidos" placeholder="Ingresa tu apellido" 
                               maxlength="50" minlength="2" required>
                    </div>

                    <!-- Correo Electrónico -->
                    <div class="mb-2">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="Email" placeholder="tu@email.com" 
                               maxlength="320" minlength="10" required>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-2">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="Contraseña" 
                               placeholder="Ingrese su contraseña" maxlength="20" minlength="8" required>
                        <span class="form-text">Mínimo 8 caracteres con mayúscula, minúscula y número</span>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="mb-2">
                        <label for="confirmPassword">Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" name="Confirmacion" 
                               placeholder="Confirme su contraseña" maxlength="20" minlength="8" required>
                    </div>

                    <!-- Fecha de Nacimiento (NUEVO) -->
                    <div class="mb-2">
                        <label for="fechaNacimiento">Fecha de Nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="FechaNacimiento" required>
                    </div>

                    <!-- Nacionalidad (NUEVO - Selector personalizado) -->
                    <div class="mb-2">
                        <label for="nacionalidad">Nacionalidad</label>
                        <div class="selector-paises" id="selectorPaises">
                            <input type="text" id="buscarPais" placeholder="Buscar país..." 
                                   class="input-pais">
                            <div id="listaPaises" class="lista-paises">
                                <!-- Aquí se cargarán dinámicamente los países desde la API -->
                            </div>
                            <input type="hidden" id="nacionalidad" name="Nacionalidad" required>
                        </div>
                        <span class="form-text">Selecciona tu país de origen</span>
                    </div>

                    <!-- Aceptación de Términos (NUEVO) -->
                    <div class="mb-2 terminos">
                        <input type="checkbox" id="terminos" name="Terminos" required>
                        <label for="terminos" class="label-terminos">
                            Acepto los <a href="#" target="_blank">Términos y Condiciones</a> y la 
                            <a href="#" target="_blank">Política de Privacidad</a>
                        </label>
                    </div>

                    <button type="submit">Registrarse</button>
                </form>

                <div class="enlaces-formulario">
                    <p>¿Ya tienes cuenta? <a href="login.html"><b>Inicia Sesión</b></a></p>
                    <p><a href="../../index.html">← Volver al inicio</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Daat Devotional - Todos los derechos reservados</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/registro.js"></script>
</body>
</html>
